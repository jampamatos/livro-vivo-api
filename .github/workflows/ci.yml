name: API CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  tests:
    name: Unit Tests + Migration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python manage.py test

      - name: Ensure no pending migrations
        run: python manage.py makemigrations --check --dry-run

  postgres-smoke:
    name: Postgres Smoke Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: livro_vivo_ci
          POSTGRES_USER: livro_vivo
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livro_vivo -d livro_vivo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: development
      DEBUG: 'true'
      DATABASE_URL: postgresql://livro_vivo@127.0.0.1:5432/livro_vivo_ci
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:8081
      APP_VERSION: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations on Postgres
        run: python manage.py migrate --noinput

      - name: Run Django system checks
        run: python manage.py check

      - name: Smoke readiness endpoint
        run: |
          python manage.py shell -c "from django.test import Client; response = Client().get('/readyz/'); assert response.status_code == 200, response.content"

  production-settings:
    name: Production Settings Check
    runs-on: ubuntu-latest

    env:
      DJANGO_ENV: production
      DEBUG: 'false'
      DJANGO_SECRET_KEY: ci-production-secret-key-with-minimum-length-1234567890
      DJANGO_ALLOWED_HOSTS: api.example.com
      DJANGO_CORS_ALLOWED_ORIGINS: https://app.example.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://app.example.com
      DATABASE_URL: sqlite:///./ci-prod-check.sqlite3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django deploy checks
        run: python manage.py check --deploy --fail-level WARNING
